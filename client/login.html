<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ==========================================================================
       LOGIN PORTAL
       Kerala Textiles POS Billing & Retail Management System
       ========================================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In • Kerala Textiles POS</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-wrapper">
    <!-- Atmospheric Ambient Overlay -->
    <div class="login-overlay"></div>

    <!-- Luxury Frosted Card -->
    <div class="login-card">
      <div class="header">
        <img src="/images/kerala_textiles_logo.jpg" alt="Kerala Textiles Logo" class="brand-logo">
        <h2>Kerala Textiles</h2>
        <span class="portal-badge">Retail POS & Billing</span>
        <p>Sign in to access your terminal</p>
      </div>

      <div id="error-box" class="error-msg" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" class="input-field" placeholder="Enter username" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="input-field" placeholder="Enter password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-signin">
          <span>Sign In to Terminal</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="login-footer-links">
        <a href="/" class="back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Return to Store Lookbook
        </a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
